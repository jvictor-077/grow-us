<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../css/login.css" class="css">
    <title>Painel do Funcionário - Layout Diagonal</title>
</head>
<body>

    <div class="container">
        <!-- LADO ESQUERDO -->
        <div class="left-side">
            <div class="image-block">

                <a href="#" class="card-link link-lua-style" title="Perfil de Lua">
                    <img src="../../../assets/images/Match 02.svg" alt="Imagem de Lua">
                </a>

                <a href="#" class="card-link link-paulo-style" title="Perfil de Paulo">
                    <img src="../../../assets/images/Match 01.svg" alt="Imagem de Paulo">
                </a>

                <!-- Ícone Central -->
                <div class="middle-icon">
                    <a href="#" title="Conexão">
                        <img src="../../../assets/images/connection.svg" width="100" height="100" alt="Ícone de conexão">
                    </a>
                </div>

            </div>
        </div>

        <!-- LADO DIREITO -->
        <div class="back">
            <div class="login-wrapper">
                <div class="login-box">
                    <h2>Painel de Cadastro</h2>
                    <p>Insira os dados abaixo para se cadastrar e acessar</p>

                    <form>
                        <label for="email">Email Corporativo</label>
                        <input type="email" id="email" placeholder="joao@empresa.com">
                        <a href="./cadastro-skills.html" class="btn-entrar">Cadastre-se</a>

                    </form>

                    <hr>
                </div>

                <a href="../../../../index.html" class="voltar">Voltar para a página inicial</a>
                
            </div>
        </div>
    </div>

</body>
</html>
