<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="img-container">
            <img src="imgs/img.png" alt="Ilustração">
        </div>

        <div class="back">
            <div class="login-wrapper">
                <div class="login-box">
                    <h2>Painel do Administrador</h2>
                    <p>Insira os dados abaixo e acesse o sistema</p>

                    <form>
                        <label for="cpf">CPF/CRMV</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00 ou NIS">

                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Digite sua senha">

                        <button type="submit" class="btn-entrar">Entrar</button>
                    </form>

                    <hr>

                    <button class="btn-primeiro-acesso">Primeiro Acesso?</button>
                </div>

                <!-- Agora o link fica fora da caixa, mas centralizado -->
                <a href="#" class="voltar">Voltar para a página inicial</a>
            </div>
        </div>
    </div>

</body>
</html>
